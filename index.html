<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildfire Risk & Satellite Alert Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div id="sidebar">
        <h2>Wildfire Sentinel</h2>
        <p class="disclaimer">⚠️ Informational tool based on satellite thermal anomalies. Not an official evacuation
            advisory.</p>

        <div class="control-group">
            <label for="addressInput">Saved Location / Address:</label>
            <input type="text" id="addressInput" placeholder="e.g. Redding, CA">
            <button id="searchBtn">Locate & Analyze</button>
        </div>

        <div class="control-group">
            <label for="radiusSelect">Alert Radius (Miles):</label>
            <select id="radiusSelect">
                <option value="10">10 Miles</option>
                <option value="25" selected>25 Miles</option>
                <option value="50">50 Miles</option>
            </select>
        </div>

        <div id="riskCard" class="card hidden">
            <h3>Risk Context Score</h3>
            <div id="scoreDisplay">0</div>
            <ul id="scoreReasons"></ul>
        </div>

        <div class="control-group">
            <label for="timeSlider">Timeline Replay (Last 24 Hours):</label>
            <input type="range" id="timeSlider" min="0" max="24" value="24" step="1">
            <span id="timeLabel">Showing all detections</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js"></script>
    <script src="js/firms.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
